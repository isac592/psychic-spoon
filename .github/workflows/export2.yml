name: Anima Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy transformers diffusers safetensors huggingface_hub
          pip install litert-torch || true
          pip install ai-edge-torch || true
      - name: download script
        id: dl
        continue-on-error: true
        run: |
          mkdir -p out
          : > out/diag.txt
          URLS="https://paste.rs/zyBR8 https://paste.rs/yG98C https://paste.rs/v3mVf"
          OK=0
          for u in $URLS; do
            echo "try $u" >> out/diag.txt
            rm -f exp.py
            if curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors --max-time 90 -o exp.py "$u" 2>> out/diag.txt; then
              SZ=$(wc -c < exp.py)
              echo "got $SZ bytes" >> out/diag.txt
              if [ "$SZ" -gt 2000 ] && head -1 exp.py | grep -qE "^(import|#|from)"; then
                echo "verified" >> out/diag.txt
                OK=1
                break
              fi
            fi
            sleep 3
          done
          echo "OK=$OK" >> out/diag.txt
          cat out/diag.txt
          if [ "$OK" != "1" ]; then exit 1; fi
      - name: run
        if: steps.dl.outcome == 'success'
        run: python exp.py
      - name: commit small files
        if: always()
        run: |
          mkdir -p out
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f out/ || true
          git commit -m "anima probe" || true
          git push || true
      - name: upload big files to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la model/ || true
          gh release delete anima --yes --cleanup-tag 2>/dev/null || true
          gh release create anima --title "Anima artifacts" --notes "auto" 2>/dev/null || true
          gh release upload anima model/* --clobber 2>/dev/null || echo "no model files"
      - name: report
        if: always()
        run: |
          if [ "${{ steps.dl.outcome }}" != "success" ]; then
            echo "SCRIPT DOWNLOAD FAILED - see out/diag.txt"
            exit 1
          fi
